name: testflight

# Builds a Release archive on a GitHub Mac and uploads it to TestFlight. Run it by hand from the Actions tab.
# Needs repo secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, Admin role, so
# Xcode cloud signing can create the distribution certificate and profile) and APPLE_TEAM_ID.
# Optional: REVENUECAT_IOS_KEY.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL baked into the build (https://...). Empty = no backend."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      # Optional: RevenueCat public iOS SDK key (appl_...). Empty = purchases unavailable in that build.
      REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see the header of testflight.yml)"; exit 1; }
          done
      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] || { echo "::error::Missing secret ASC_KEY_P8"; exit 1; }
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
      - run: xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Archive (unsigned; export signs it)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MusicDecoded.xcodeproj -scheme MusicDecoded -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MusicDecoded.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            API_BASE_URL="$API_BASE_URL" \
            REVENUECAT_API_KEY="$REVENUECAT_API_KEY" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO
      - name: Sign and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MusicDecoded.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $GITHUB_RUN_NUMBER. It shows up in TestFlight after Apple processes it (10-30 min)."
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
