name: android

on:
  # push only on main; branches are covered by pull_request, so PR commits don't run twice.
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "contracts/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "contracts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      # JDK 21 matches toolchainVersion in apps/android/gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        # gradlew is committed without the executable bit (mode 100644), so invoke it through sh.
        run: sh ./gradlew assembleDebug testDebugUnitTest
