name: ios

on:
  push:
    paths:
      - "apps/ios/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: MusicDecodedCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift test
        working-directory: apps/ios/Packages/MusicDecodedCore
        run: swift test

  app-macos:
    name: App (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: simulator
        # Runner images change their simulator set, so use whatever iPhone is available.
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | test("SimRuntime\\.iOS")) | .value[]
             | select(.name | startswith("iPhone"))] | first | .udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project MusicDecoded.xcodeproj \
            -scheme MusicDecoded \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            build test
