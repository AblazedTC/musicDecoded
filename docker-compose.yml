services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: musicdecoded
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/musicdecoded
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./apps/worker
    volumes:
      # Mount local data/outputs folders so files persist outside the container
      - ./apps/worker/data:/app/data
      - ./apps/worker/outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
