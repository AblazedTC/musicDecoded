[project]
name = "musicdecoded-api"
version = "0.1.0"
description = "MusicDecoded API (contracts/openapi.yaml)"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "alembic>=1.20.1",
    "redis>=8.1.0",
    "botocore>=1.43.121",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "fakeredis>=2.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
