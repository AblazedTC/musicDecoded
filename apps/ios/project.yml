# XcodeGen spec. Generate the project with:  xcodegen generate
# MusicDecoded.xcodeproj is generated and NOT committed (see .gitignore).
name: MusicDecoded

options:
  bundleIdPrefix: com.musicdecoded
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  MusicDecodedCore:
    path: Packages/MusicDecodedCore
  # The only third-party dependency (PLAN.md §9): App Store purchases with a cross-store entitlement backend.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    exactVersion: 5.95.0

targets:
  MusicDecoded:
    type: application
    platform: iOS
    sources:
      - path: MusicDecoded
      # Contracts are referenced from the repo, not copied. The voicing table ships in every build;
      # the analysis fixtures are for Debug runs and previews only (Release excludes them below).
      - path: ../../contracts/chord-voicings.json
        buildPhase: resources
        group: Contracts
      - path: ../../contracts/fixtures/sunnydays.analysis.json
        buildPhase: resources
        group: Contracts
      - path: ../../contracts/fixtures/sample.analysis.json
        buildPhase: resources
        group: Contracts
    dependencies:
      - package: MusicDecodedCore
      - package: RevenueCat
        product: RevenueCat
    info:
      path: Generated/MusicDecoded-Info.plist
      properties:
        CFBundleDisplayName: MusicDecoded
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard HTTPS only, so TestFlight/App Store skip the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # Bundled "Wrapped" faces (DESIGN.md §1), SIL OFL: Resources/Licenses.
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Landscape gives the Piano learning view a wider keyboard (DESIGN.md §3.8).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "MusicDecoded records audio so it can transcribe the chords."
        NSAppleMusicUsageDescription: "MusicDecoded imports songs you choose from your music library so it can decode their chords."
        # Read at runtime via Bundle.main.object(forInfoDictionaryKey: "APIBaseURL").
        APIBaseURL: $(API_BASE_URL)
        # RevenueCat public SDK key (T-602i); empty = "Purchases aren't available in this build".
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicdecoded.app
        MARKETING_VERSION: "1.0"
        # CI overrides this with the run number for TestFlight uploads (testflight.yml).
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: MusicDecoded
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # The ATS script below edits the built Info.plist, which the script sandbox forbids.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          # Debug-only fixtures (DebugFixtures); keeps them out of shipped builds.
          EXCLUDED_SOURCE_FILE_NAMES: "*.analysis.json"
    postBuildScripts:
      # The Info.plist is generated once for all configurations, so the Debug-only
      # ATS exception (plain HTTP to http://localhost:8080) is added to the built copy here.
      - name: "ATS: allow localhost (Debug only)"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ "${CONFIGURATION}" != "Debug" ]; then
            exit 0
          fi
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :NSAppTransportSecurity dict" \
            -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" \
            "$PLIST"

  MusicDecodedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MusicDecodedTests
      # Contracts are referenced from the repo, not copied (T-003).
      - path: ../../contracts/fixtures/sample.analysis.json
        buildPhase: resources
        group: Contracts
      - path: ../../contracts/fixtures/sunnydays.analysis.json
        buildPhase: resources
        group: Contracts
      - path: ../../contracts/chord-voicings.json
        buildPhase: resources
        group: Contracts
    dependencies:
      - target: MusicDecoded
      - package: MusicDecodedCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicdecoded.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MusicDecoded:
    build:
      targets:
        MusicDecoded: all
        MusicDecodedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusicDecodedTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
